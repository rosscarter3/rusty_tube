[package]
name = "rusty_tube"
version = "0.2.0"
edition = "2021"
description = "Rust port of tubulaton: 3D microtubule self-organisation in plant cells, with a real-time renderer"
license = "GPL-3.0-only"
readme = "README.md"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
egui = "0.36"
egui-wgpu = { version = "0.36", features = ["winit"] }
egui-winit = "0.36"
glam = { version = "0.33", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png"] }
indicatif = "0.17"
pollster = "0.4"
rayon = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"
winit = "0.30"

[profile.release]
debug = 1
codegen-units = 4

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
